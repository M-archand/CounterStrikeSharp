version: 2
updates:
  # Update the submodule in libraries/s2sdk-cs2 every day
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    allow:
      - dependency-name: "libraries/s2sdk-cs2"
      - dependency-name: "libraries/metamod-source"
      - dependency-name: "libraries/Protobufs"
    schedule:
      interval: "daily"
    # Exempt submodules from cooldown
    cooldown:
      default-days: 1
      exclude:
        - "*"
    commit-message:
      prefix: "chore(deps)"
